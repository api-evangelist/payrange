name: PayRange
description: 'PayRange is a fintech company providing cashless commerce and self-service
  retail technology for unattended machines. Its platform enables mobile payments,
  age and identity verification, and access control across laundromats, vending, car
  washes, campgrounds, hospitality, micro-markets, coffee, and transit ticketing.
  Hardware includes the BluKey family, BluCheck, and PayStation, paired with a consumer
  mobile app and an operator Business Management Suite. Backed by GV and Matrix Partners.
  No public developer API, documentation, or SDK surface was found during enrichment;
  integrations appear to run through direct partner and licensing channels.'
